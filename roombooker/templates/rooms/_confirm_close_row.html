<tr id="room-{{ room.id }}" class="room-row is-confirming">
  <td colspan="5">
    <form class="confirm" method="post" action="/manage-rooms/{{ room.id }}/close"
          hx-post="/manage-rooms/{{ room.id }}/close" hx-target="closest tr" hx-swap="outerHTML">
      <p class="confirm-question">Close {{ room.name }}? No one can book it until you reopen it, and its future bookings are cancelled.</p>
      <div class="form-actions">
        <button class="button button-secondary" type="submit">Close room</button>
        <a class="button button-secondary" href="/manage-rooms" autofocus
           hx-get="/manage-rooms" hx-select="#room-{{ room.id }}" hx-target="closest tr" hx-swap="outerHTML">Keep open</a>
      </div>
    </form>
  </td>
</tr>
