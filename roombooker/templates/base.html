<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Room Booking</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top-bar">
    <a class="app-name" href="/">Room Booking</a>
    {% if person %}
    <a class="current-person" href="{{ pick_url(path_with_query(request)) }}">
      <span class="current-person-name">{{ person.name }}</span>
      <span class="switch-hint">Switch</span>
    </a>
    {% endif %}
  </header>
  <div id="announce" class="announce" role="status" aria-live="polite">{% block announce %}{% endblock %}</div>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
