[project]
name = "roombooker"
version = "0.1.0"
description = "Company Room Booking: internal room booking for London, Manchester and Leeds"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "playwright==1.65.1",
    "pytest-playwright==0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
